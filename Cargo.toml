[package]
name = "kira-scio"
description = "Deterministic single-cell count-matrix ingestion: 10x MTX and .h5, AnnData .h5ad, BD Rhapsody and dense tables into canonical CSC with QC marginals."
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ARyaskov/kira-scio"
keywords = [
    "bioinformatics",
    "single-cell",
    "mtx",
    "h5ad",
    "anndata"
]
# Library only: no binary is shipped, so no `command-line-utilities`.
categories = [
    "science",
    "science::bioinformatics",
    "parser-implementations"
]

[lib]
name = "kira_scio"
path = "src/lib.rs"

# `loom` is reserved for a future reader; the current `formats::loom` module
# is a placeholder that returns FeatureDisabled regardless of the flag.

[dependencies]
flate2 = { version = "1", features = ["zlib-rs"] }
unicode-normalization = "0.1"
thiserror = "2"
rustc-hash = "2"
tracing = "0.1"
itoa = "1"

# `hdf5-metno` is the maintained fork of the `hdf5` crate; it supports
# HDF5 1.8 through 2.x (the original 0.8 bindings reject HDF5 >= 2.0).
[dependencies.hdf5]
package = "hdf5-metno"
version = "0.15"
optional = true

[dev-dependencies]
proptest = "1"

[features]
default = []
# HDF5 bindings shared by the HDF5-based readers.
hdf5 = ["dep:hdf5"]
# AnnData `.h5ad` reader.
h5ad = ["hdf5"]
# 10x Genomics Cell Ranger `.h5` reader (filtered/raw_feature_bc_matrix.h5).
tenx-h5 = ["hdf5"]

# Applies only to builds of this package itself (examples, tests); Cargo
# ignores a dependency's profile, so downstream crates set their own.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
